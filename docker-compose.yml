name: auth-study

services:
  keycloak:
    container_name: auth-study-keycloak
    image: quay.io/keycloak/keycloak:26.2

    command: start-dev

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

    ports:
      - "127.0.0.1:8080:8080"

  permify:
    container_name: auth-study-permify
    image: ghcr.io/permify/permify:latest

    command: serve

    ports:
      - "127.0.0.1:3476:3476"
      - "127.0.0.1:3478:3478"